<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wall</title>
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="Everything trending, without the apps.">

<!-- Warm up the image CDNs before the JSON even lands. -->
<link rel="preconnect" href="https://preview.redd.it" crossorigin>
<link rel="preconnect" href="https://external-preview.redd.it" crossorigin>
<link rel="preconnect" href="https://i.redd.it" crossorigin>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="dot"></span>
    <h1>The Wall</h1>
    <span class="stamp" id="stamp"></span>
  </div>
  <div class="actions">
    <button class="icon" id="tune" title="Tuned to what you open" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="currentColor"/></svg>
    </button>
    <button class="icon" id="saver" title="Data saver" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M5 8h14M5 16h14"/></svg>
    </button>
    <button class="icon" id="refresh" title="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<nav class="chips" id="chips" aria-label="Topics"></nav>

<section class="threads" id="threads" hidden aria-label="Story threads"></section>

<main id="wall" class="wall" aria-live="polite"></main>

<div class="empty" id="empty" hidden>
  <p>Nothing here yet.</p>
  <p class="sub">Pick a topic above, or hit refresh.</p>
</div>

<footer class="foot" id="foot"></footer>

<!-- Tap-to-expand context sheet -->
<dialog id="sheet" class="sheet">
  <button class="close" id="sheetClose" aria-label="Close">&times;</button>
  <div id="sheetBody"></div>
</dialog>

<!-- Background-gather splash, shown only on a cold build -->
<div class="splash" id="splash" hidden>
  <div class="orb"><i></i><i></i><i></i></div>
  <p id="splashMsg">Gathering the internet…</p>
  <p class="sub">This runs in the background. Go do something else — it'll be here.</p>
</div>

<script src="./assets/app.js" type="module"></script>
</body>
</html>
