name: Refresh feed

on:
  schedule:
    # Every 4 hours. Cheap, and the internet doesn't move faster than that.
    - cron: '0 */4 * * *'
  workflow_dispatch:        # lets the in-page "refresh" button trigger a rebuild
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build feed
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-feed.mjs

      - name: Commit if changed
        run: |
          git config user.name  "wall-bot"
          git config user.email "wall-bot@users.noreply.github.com"
          git add data/feed.json data/memory.json
          git diff --staged --quiet || git commit -m "feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
