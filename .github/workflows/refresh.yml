name: Refresh feed

on:
  schedule:
    # Every 4 hours. Cheap, and the internet doesn't move faster than that.
    - cron: '0 */4 * * *'
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]

# Pages deployment needs id-token; the memory branch needs contents.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The glossary lives on an orphan branch that only ever holds one commit,
      # so it persists across builds without growing the repo's history.
      - name: Restore glossary + archive
        run: |
          mkdir -p data
          git fetch origin state 2>/dev/null || echo "no state branch yet — first run"
          git show origin/state:memory.json > data/memory.json 2>/dev/null \
            || echo '{"version":1,"glossary":{},"annotated":{}}' > data/memory.json
          git show origin/state:archive.json > data/archive.json 2>/dev/null \
            || echo '{"version":1,"items":[]}' > data/archive.json
          echo "memory:  $(wc -c < data/memory.json) bytes"
          echo "archive: $(wc -c < data/archive.json) bytes"

      - name: Build feed
        env:
          # Lemmy, Know Your Meme, Wikipedia, Bluesky, Hacker News and the
          # top-comment lookups all need no keys at all.
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          # Free tier, no credit card. Preferred over Anthropic when both exist.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-feed.mjs

      # Force-push a single-commit branch. History never grows; no merge
      # conflicts, because nothing generated ever lands on main.
      - name: Persist glossary + archive
        run: |
          tmp=$(mktemp -d)
          cp data/memory.json data/archive.json "$tmp/"
          cd "$tmp"
          git init -q -b state
          git config user.name  "wall-bot"
          git config user.email "wall-bot@users.noreply.github.com"
          git add memory.json archive.json
          git commit -q -m "state as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          mkdir -p _site/data
          cp data/feed.json _site/data/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
